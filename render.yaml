services:
  - type: web
    name: enterprise-research-backend
    env: python
    region: ohio
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
